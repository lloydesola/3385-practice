<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merlin's Daily Wisdom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #faf8f4;
    --text: #1a1a1a;
    --accent: #8b5e3c;
    --muted: #767676;
    --border: #e8e3dc;
  }

    font-family: Georgia, 'Times New Roman', serif;

    color: var(--text);

    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  .container {
    max-width: 600px;
    width: 100%;
    text-align: center;
  }

  .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }

  .date-label {
    font-size: 0.85rem;
    color: var(--accent);
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    margin-bottom: 2.5rem;
    font-style: italic;
  }

  .wisdom-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3rem 2.5rem;
    margin-bottom: 2rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    position: relative;
  }

  .open-quote {
    font-size: 5rem;
    line-height: 0;
    color: var(--border);
    position: absolute;
    top: 2.8rem;
    left: 1.8rem;
    font-family: Georgia, serif;
    user-select: none;
  }

  .wisdom-text {
    font-size: clamp(1.15rem, 3vw, 1.45rem);
    line-height: 1.75;
    color: var(--text);
    font-style: italic;
    position: relative;
    z-index: 1;
  }

  .attribution {
    margin-top: 1.8rem;
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-style: normal;
    letter-spacing: 0.05em;
  }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    margin-bottom: 2rem;
  }

  .nav-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0.4rem 0.9rem;
    font-size: 0.75rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  .nav-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .nav-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .nav-label {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    min-width: 5rem;
  }

  .actions {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .action-btn {
    background: none;
    border: none;
    font-size: 0.75rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    color: var(--muted);
    cursor: pointer;
    padding: 0.3rem 0.5rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: color 0.15s;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .action-btn:hover { color: var(--accent); }

  .action-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(1rem);
    background: var(--text);
    color: var(--bg);
    padding: 0.6rem 1.2rem;
    border-radius: 2px;
    font-size: 0.8rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    white-space: nowrap;
  }

    opacity: 1;
    transform: translateX(-50%) translateY(0);

    margin-top: 3rem;
    font-size: 0.68rem;
    color: #ccc;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    letter-spacing: 0.05em;
  }

    color: #ccc;
    text-decoration: none;
  }

</style>

// Date helpers
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function dateFromOffset(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d;
}

function formatDate(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function indexForDate(d) {
  // Deterministic index based on date — cycles through all wisdom
  const epoch = new Date(2024, 0, 1);
  const daysSince = Math.floor((d - epoch) / 86400000);
  return ((daysSince % WISDOM.length) + WISDOM.length) % WISDOM.length;
}

let offset = 0; // 0 = today, -1 = yesterday, etc.

function render() {
  const d = dateFromOffset(offset);
  const idx = indexForDate(d);
  document.getElementById('wisdom-text').textContent = WISDOM[idx];
  
  const isToday = offset === 0;
  const isTomorrow = offset === 1;
  document.getElementById('date-label').textContent = 
    isToday ? 'Today · ' + formatDate(d) :
    isTomorrow ? 'Tomorrow · ' + formatDate(d) :
    offset === -1 ? 'Yesterday · ' + formatDate(d) :
    formatDate(d);

  document.getElementById('next-btn').disabled = offset >= 1;
  document.getElementById('nav-label').textContent = isToday ? 'Today' : (offset > 0 ? `+${offset}d` : `${offset}d`);
}

function navigate(dir) {
  offset = Math.min(1, offset + dir);
  render();
}

function goToday() {
  offset = 0;
  render();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function copyWisdom() {
  const text = document.getElementById('wisdom-text').textContent;
  navigator.clipboard.writeText(`"${text}" — Merlin Mann`).then(() => {
    showToast('Copied to clipboard');
  });
}

function shareWisdom() {
  const text = document.getElementById('wisdom-text').textContent;
  const shareText = `"${text}" — Merlin Mann\n\nFrom Merlin's Wisdom Project`;
  if (navigator.share) {
    navigator.share({ text: shareText }).catch(() => {});
  } else {
    navigator.clipboard.writeText(shareText).then(() => showToast('Copied for sharing'));
  }
}

render();
</script>
</body>
